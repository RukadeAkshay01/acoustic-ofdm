name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v
      - name: Simulated over-the-air transfer (both FEC schemes)
        run: |
          python experiments/run_acoustic.py --sim --fec 3 --out /tmp/sim_rep.npz
          python experiments/run_acoustic.py --sim --fec conv --out /tmp/sim_conv.npz
      - name: Simulated two-device link
        run: python experiments/run_two_device.py sim
